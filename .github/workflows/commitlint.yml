name: Commitlint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject mixed-authorship Dependabot PR
        if: env.DEPENDABOT_PR == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const invalidCommits = commits.filter(
              ({ author }) => author?.login !== 'dependabot[bot]',
            );

            if (invalidCommits.length > 0) {
              const details = invalidCommits
                .map(({ sha, author }) => `${sha.slice(0, 7)} (${author?.login ?? 'unknown'})`)
                .join(', ');
              core.setFailed(
                `Dependabot PRs must contain only Dependabot-authored commits: ${details}`,
              );
            }

      - name: Validate PR commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs
